[nightlight]
enabled = true
temperature_night = 3000

[plugins]
enabled = [ "kenn/keybind-cheatsheet" ]

[shell]
app_icon_colorize = true
avatar_path = "/home/raceer/Pictures/pfp/draken.jpg"
font_family = "Adwaita Mono"

    [shell.launcher]
    app_grid = true
    show_app_origin_indicator = false

        [shell.launcher.providers.emoji]
        global = true

        [shell.launcher.providers.wallpaper]
        global = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true

[theme]
builtin = "Nord"
community_palette = "Creamy Forest"
mode = "dark"
source = "community"
wallpaper_scheme = "muted"

    [theme.templates]
    builtin_ids = [ "emacs", "gtk3", "gtk4", "kitty", "niri", "qt" ]
    community_ids = [
        "opencode",
        "zen-browser",
        "discord",
        "telegram",
        "blender",
        "gimp",
        "neovim",
        "obsidian",
        "vscode",
        "steam",
        "obs"
    ]

[wallpaper]
directory = "/home/raceer/Pictures/wallpapers"

[widget.media]
enabled = false

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.workspaces]
style = "minimal"
