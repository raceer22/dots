[bar]
order = [ "default", "custom" ]

    [bar.custom]
    enabled = false

    [bar.default]
    font_weight = 700
    margin_ends = 0
    radius_top_left = 0
    radius_top_right = 0
    thickness = 25
    widget_spacing = 32

        [bar.default.monitor.DP-1]

        [bar.default.monitor.DP-2]
        enabled = false

        [bar.default.monitor.HDMI-A-1]
        enabled = false

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
active_monitor_only = true
auto_hide = true
enabled = true
icon_size = 38
magnification_scale = 1.850000012665987
radius_bottom_left = 0
radius_bottom_right = 0
reserve_space = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 0.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 0.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    locked_timeout = 60.0
    timeout = 660.0

[keybinds]
down = [ "Down", "Ctrl+j" ]
left = [ "Left", "Ctrl+h" ]
right = [ "Right", "Ctrl+l" ]
up = [ "Up", "Ctrl+k" ]

